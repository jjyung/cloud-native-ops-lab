apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-v2
  namespace: demo
  labels:
    app: hello
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
      version: v2
  template:
    metadata:
      labels:
        app: hello
        version: v2
    spec:
      containers:
        - name: hello
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=hello-v2"
          ports:
            - name: http
              containerPort: 5678
